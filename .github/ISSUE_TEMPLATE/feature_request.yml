name: Feature request
description: Suggest an improvement for Chatlog Studio.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Chatlog Studio is in an early testing stage, so practical workflows and compatibility details are especially useful.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "Example: I need to export conversations in a format that works with..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web UI
        - CLI
        - WeChat data discovery
        - Export format
        - Media handling
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: If you already use another workflow, describe it briefly.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Do not include private chat content or sensitive local data.
